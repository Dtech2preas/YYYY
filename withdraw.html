<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Withdraw - DTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --surface: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
            --radius: 12px;
            --primary: #3b82f6;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--success);
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .current-bal {
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .current-bal span {
            color: var(--success);
            font-size: 1.5rem;
        }

        .method-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .method-tab {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .method-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            box-sizing: border-box;
            font-family: inherit;
        }

        .form-group select option {
            background: var(--surface);
            color: var(--text-main);
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        button:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-block;
            margin-top: 20px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .dynamic-fields {
            display: none;
        }

        .dynamic-fields.active {
            display: block;
        }

        .history-section {
            margin-top: 30px;
            text-align: left;
        }

        .history-section h2 {
            font-size: 1.2rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            border-left: 3px solid var(--text-muted);
        }

        .history-item.status-pending { border-left-color: #f59e0b; }
        .history-item.status-paid { border-left-color: var(--success); }

        .status-badge {
            float: right;
            font-size: 0.8rem;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .status-badge.pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-badge.paid { background: rgba(16, 185, 129, 0.2); color: var(--success); }

        .method-info {
            font-size: 0.85rem;
            color: var(--primary);
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 6px;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Cash Out</h1>
            <p>Exchange your hard-earned points for rewards!</p>

            <div class="current-bal">
                Balance: <span id="withdraw-points">0</span> pts
            </div>

            <div class="method-tabs">
                <div class="method-tab active" onclick="setMethod('Airtime')">Airtime</div>
                <div class="method-tab" onclick="setMethod('Voucher')">Voucher</div>
                <div class="method-tab" onclick="setMethod('Capitec')">Capitec</div>
            </div>

            <div id="info-airtime" class="method-info">Minimum: 1000 Points</div>
            <div id="info-voucher" class="method-info" style="display:none;">Minimum: 2000 Points</div>
            <div id="info-capitec" class="method-info" style="display:none;">Minimum: 10000 Points</div>

            <div class="form-group">
                <label for="withdraw-tier">Select Amount:</label>
                <select id="withdraw-tier" onchange="checkEligibility()">
                    <!-- Options populated via JS -->
                </select>
            </div>

            <!-- AIRTIME FIELDS -->
            <div id="fields-Airtime" class="dynamic-fields active">
                <div class="form-group">
                    <label>Mobile Number:</label>
                    <input type="tel" id="airtime-mobile" placeholder="e.g. 082 123 4567">
                </div>
                <div class="form-group">
                    <label>Network Provider:</label>
                    <select id="airtime-network">
                        <option value="Vodacom">Vodacom</option>
                        <option value="MTN">MTN</option>
                        <option value="Cell C">Cell C</option>
                        <option value="Telkom">Telkom</option>
                    </select>
                </div>
            </div>

            <!-- VOUCHER FIELDS -->
            <div id="fields-Voucher" class="dynamic-fields">
                <div class="form-group">
                    <label>Mobile Number:</label>
                    <input type="tel" id="voucher-mobile" placeholder="e.g. 082 123 4567">
                </div>
                <div class="form-group">
                    <label>WhatsApp Number (Required):</label>
                    <input type="tel" id="voucher-whatsapp" placeholder="For sending the voucher">
                </div>
                <div class="form-group">
                    <label>Voucher Type:</label>
                    <select id="voucher-type">
                        <option value="1Voucher">1Voucher</option>
                        <option value="Blu Voucher">Blu Voucher</option>
                    </select>
                </div>
            </div>

            <!-- CAPITEC FIELDS -->
            <div id="fields-Capitec" class="dynamic-fields">
                <div class="form-group">
                    <label>Recipient Mobile Number:</label>
                    <input type="tel" id="capitec-mobile" placeholder="e.g. 082 123 4567">
                </div>
                <p style="font-size:0.8rem; color:var(--text-muted); text-align:left; margin-top:-5px;">* Sent via Capitec Cash Transfer to this number.</p>
            </div>

            <button id="withdraw-btn" onclick="submitWithdrawal()" disabled>Request Withdrawal</button>
        </div>

        <div class="card" style="margin-top: 20px;">
            <div class="history-section">
                <h2>Withdrawal History</h2>
                <div id="history-list">
                    <p style="color: var(--text-muted); font-size: 0.9rem;">No past withdrawals.</p>
                </div>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
        </div>
    </div>

    <script>
        const API_URL = "https://crimson-art-f482.lefa4082.workers.dev";
        const user = JSON.parse(localStorage.getItem('dtech_user'));

        if (!user || !user.username) {
            window.location.href = 'index.html';
        }

        let currentPoints = 0;
        let currentMethod = 'Airtime';

        const TIERS = [
            { pts: 1000, rand: 10 },
            { pts: 1500, rand: 15 },
            { pts: 2000, rand: 20 },
            { pts: 2500, rand: 25 },
            { pts: 3000, rand: 30 },
            { pts: 4000, rand: 40 },
            { pts: 5000, rand: 50 },
            { pts: 10000, rand: 100 },
            { pts: 15000, rand: 150 },
            { pts: 20000, rand: 200 }
        ];

        const MINIMUMS = {
            'Airtime': 1000,
            'Voucher': 2000,
            'Capitec': 10000
        };

        function setMethod(method) {
            currentMethod = method;

            // Tabs UI
            document.querySelectorAll('.method-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // Fields UI
            document.querySelectorAll('.dynamic-fields').forEach(f => f.classList.remove('active'));
            document.getElementById('fields-' + method).classList.add('active');

            // Info UI
            document.querySelectorAll('.method-info').forEach(i => i.style.display = 'none');
            document.getElementById('info-' + method.toLowerCase()).style.display = 'block';

            populateTiers();
            checkEligibility();
        }

        function populateTiers() {
            const select = document.getElementById('withdraw-tier');
            select.innerHTML = '';

            const min = MINIMUMS[currentMethod];

            TIERS.forEach(tier => {
                if(tier.pts >= min) {
                    const opt = document.createElement('option');
                    opt.value = tier.pts + ',' + tier.rand;
                    opt.innerText = `${tier.pts} Points = R${tier.rand}`;
                    select.appendChild(opt);
                }
            });
        }

        async function fetchPoints() {
            try {
                const res = await fetch(`${API_URL}/user?username=${encodeURIComponent(user.username)}`);
                const data = await res.json();

                if (res.ok) {
                    currentPoints = data.points;
                    document.getElementById('withdraw-points').innerText = currentPoints;
                    checkEligibility();
                }
            } catch(e) {
                console.error("Failed to fetch points", e);
            }
        }

        function checkEligibility() {
            const btn = document.getElementById('withdraw-btn');
            const tierVal = document.getElementById('withdraw-tier').value;

            if(!tierVal) {
                btn.disabled = true;
                btn.innerText = "Select an amount";
                return;
            }

            const requiredPoints = parseInt(tierVal.split(',')[0]);

            if (currentPoints >= requiredPoints) {
                btn.disabled = false;
                btn.innerText = `Request R${tierVal.split(',')[1]} ${currentMethod}`;
            } else {
                btn.disabled = true;
                btn.innerText = "Not Enough Points";
            }
        }

        async function fetchHistory() {
            try {
                const res = await fetch(`${API_URL}/withdrawals?username=${encodeURIComponent(user.username)}`);
                const data = await res.json();

                if (res.ok) {
                    const list = document.getElementById('history-list');
                    if (data.length === 0) {
                        list.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No past withdrawals.</p>';
                        return;
                    }

                    list.innerHTML = '';
                    data.sort((a, b) => b.timestamp - a.timestamp).forEach(w => {
                        const statusClass = w.status === 'paid' ? 'paid' : 'pending';

                        let infoStr = '';
                        if(w.method === 'Airtime') infoStr = `${w.details.network} - ${w.details.mobile}`;
                        if(w.method === 'Voucher') infoStr = `${w.details.type} - WhatsApp: ${w.details.whatsapp}`;
                        if(w.method === 'Capitec') infoStr = `Send to: ${w.details.mobile}`;

                        list.innerHTML += `
                            <div class="history-item status-${statusClass}">
                                <span class="status-badge ${statusClass}">${w.status}</span>
                                <strong>R${w.amount}</strong> via ${w.method}<br>
                                <span style="color: var(--text-muted); font-size: 0.8rem;">${infoStr}</span><br>
                                <span style="color: var(--text-muted); font-size: 0.75rem;">Cost: ${w.points} pts</span>
                            </div>
                        `;
                    });
                }
            } catch(e) {
                console.error("Failed to fetch history", e);
            }
        }

        async function submitWithdrawal() {
            const btn = document.getElementById('withdraw-btn');
            const tierVal = document.getElementById('withdraw-tier').value;

            if (!tierVal) {
                alert("Please select a valid amount.");
                return;
            }

            const [pointsStr, amountStr] = tierVal.split(',');
            const points = parseInt(pointsStr);
            const amount = parseInt(amountStr);

            if (isNaN(points) || isNaN(amount)) {
                alert("Invalid withdrawal amount selected. Please try refreshing the page.");
                return;
            }

            let details = {};

            if (currentMethod === 'Airtime') {
                const mob = document.getElementById('airtime-mobile').value.trim();
                const net = document.getElementById('airtime-network').value;
                if(!mob) return alert("Please enter mobile number.");
                details = { mobile: mob, network: net };
            }
            else if (currentMethod === 'Voucher') {
                const mob = document.getElementById('voucher-mobile').value.trim();
                const wa = document.getElementById('voucher-whatsapp').value.trim();
                const type = document.getElementById('voucher-type').value;
                if(!mob) return alert("Please enter mobile number.");
                if(!wa) return alert("Please enter WhatsApp number for voucher delivery.");
                details = { mobile: mob, whatsapp: wa, type: type };
            }
            else if (currentMethod === 'Capitec') {
                const mob = document.getElementById('capitec-mobile').value.trim();
                if(!mob) return alert("Please enter recipient mobile number.");
                details = { mobile: mob };
            }

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const res = await fetch(`${API_URL}/withdraw`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: user.username,
                        token: user.token,
                        points: points,
                        amount: amount,
                        method: currentMethod,
                        details: details
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    alert("Withdrawal requested successfully!");
                    // Clear inputs
                    document.querySelectorAll('input').forEach(i => i.value = '');
                    fetchPoints();
                    fetchHistory();
                } else {
                    alert(data.error || "Failed to request withdrawal.");
                    checkEligibility();
                }
            } catch(e) {
                alert("Network error.");
                checkEligibility();
            }
        }

        populateTiers();
        fetchPoints();
        fetchHistory();
    </script>
</body>
</html>
