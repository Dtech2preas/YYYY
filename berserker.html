<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://quge5.com/88/tag.min.js" data-zone="253438" async data-cfasync="false"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="logo.png">
    <title>Berserker Mode - DTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --surface: #0f172a;
            --text-main: #f8fafc;
            --accent: #d4af37;
            --success: #10b981;
            --border: rgba(255, 255, 255, 0.1);
            --radius: 12px;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .points-badge {
            background: rgba(212, 175, 55, 0.15);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .ad-card {
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }

        .ad-card h2 {
            margin-top: 0;
            color: var(--accent);
        }

        .ad-card p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .watch-btn {
            background: var(--accent);
            color: #020617;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
            text-transform: uppercase;
        }

        .watch-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        .watch-btn:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .points-added-indicator {
            color: var(--success);
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s;
            height: 20px;
        }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-block;
            margin-top: 20px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div style="font-weight: 800; font-size: 1.2rem;">BERSERKER</div>
            <div class="points-badge"><span id="points-display">0</span> pts</div>
        </header>

        <div class="ad-card">
            <h2>Watch Ad</h2>
            <p>Click below to open an ad. You will instantly receive between 1 and 30 points.</p>

            <button id="watch-btn" class="watch-btn" onclick="watchAd()">Watch Ad</button>
            <div id="points-added-indicator" class="points-added-indicator"></div>
        </div>

        <div class="ad-card" style="margin-top: 20px; text-align: left; padding: 20px;">
            <h3 style="margin-top: 0; color: var(--accent); display: flex; align-items: center; gap: 8px;">
                <span>💡</span> How to Earn
            </h3>
            <ol style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0; padding-left: 20px; line-height: 1.5;">
                <li>Click the <strong>Watch Ad</strong> button.</li>
                <li>Wait for the ad page to fully load.</li>
                <li>Return to this page to instantly claim your points!</li>
            </ol>
        </div>

        <div style="text-align: center;">
            <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
        </div>
    </div>

    <div id="toast">Point Added!</div>

    <script>
        const API_URL = "https://crimson-art-f482.lefa4082.workers.dev";
        const AD_URL = "https://otieu.com/4/10205357"; // direct URL ad
        const user = JSON.parse(localStorage.getItem('dtech_user'));

        if (!user || !user.username) {
            window.location.href = 'index.html';
        }

        let basePoints = 0;

        function getPendingAdWatches() {
            const match = document.cookie.match(/(?:^|; )pending_navigation_points=([^;]*)/);
            return match ? parseInt(match[1]) || 0 : 0;
        }

        function checkCookieForPoints() {
            const pendingAdWatches = getPendingAdWatches();
            if (pendingAdWatches > 0) {
                let accumulatedLocalPoints = parseInt(localStorage.getItem('dtech_pending_points')) || 0;
                let pointsAddedThisTime = 0;

                // Generate random points for each ad watched
                for (let i = 0; i < pendingAdWatches; i++) {
                    const pts = Math.floor(Math.random() * 30) + 1;
                    accumulatedLocalPoints += pts;
                    pointsAddedThisTime += pts;
                }

                // Save to local storage
                localStorage.setItem('dtech_pending_points', accumulatedLocalPoints);

                // Reset cookie so we don't process them again
                document.cookie = `pending_navigation_points=0; path=/; max-age=31536000`;

                // Update Display
                document.getElementById('points-display').innerText = basePoints + accumulatedLocalPoints;

                // Show indicator
                const indicator = document.getElementById('points-added-indicator');
                indicator.innerText = `+${pointsAddedThisTime} Points Added!`;
                indicator.style.opacity = 1;

                // Also show toast just in case
                showToast(`+${pointsAddedThisTime} Points Added!`);

                // Re-enable button if it was disabled
                const btn = document.getElementById('watch-btn');
                btn.disabled = false;
                btn.innerText = "Watch Ad";
            }
        }

        async function updatePointsDisplay() {
            try {
                const res = await fetch(`${API_URL}/user?username=${encodeURIComponent(user.username)}`);
                if (res.ok) {
                    const data = await res.json();
                    basePoints = data.points;
                    const localPending = parseInt(localStorage.getItem('dtech_pending_points')) || 0;
                    document.getElementById('points-display').innerText = basePoints + localPending;
                }
            } catch(e) {
                console.error("Failed to fetch user points", e);
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = 1;
            setTimeout(() => t.style.opacity = 0, 3000);
        }

        function watchAd() {
            const btn = document.getElementById('watch-btn');
            btn.disabled = true;
            btn.innerText = "Processing...";

            // Hide indicator when starting a new ad
            document.getElementById('points-added-indicator').style.opacity = 0;

            // Open the Ad
            window.open(AD_URL, '_blank');

            // We no longer add points manually here.
            // We rely on the Android tracking layer setting the cookie
            // and our interval picking it up.

            // Fallback in case cookie is never set (e.g., ad blocker blocked window open)
            setTimeout(() => {
                if (btn.disabled) {
                    btn.disabled = false;
                    btn.innerText = "Watch Ad";
                }
            }, 5000);
        }

        // Check for points every second
        setInterval(checkCookieForPoints, 1000);

        // Also check when tab becomes visible again
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                checkCookieForPoints();
            }
        });

        // Initialize
        updatePointsDisplay();
    </script>
</body>
</html>
